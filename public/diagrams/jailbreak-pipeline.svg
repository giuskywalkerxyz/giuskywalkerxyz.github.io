<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="AI jailbreak pipeline: recon the model, craft an adversarial prompt, deliver it directly or indirectly, and bypass the guardrails into policy-violating output; a guardrail layer breaks the chain">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <marker id="jarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff3b3b"/>
    </marker>
    <style>
      .b{fill:#0e1420;stroke:#24344f;stroke-width:1.5;}
      .lit{stroke:#c81e1e;}
      .h{fill:#eaf2ff;font-size:15px;font-weight:700;}
      .t{fill:#c7d2e4;font-size:13px;}
      .d{fill:#7f8ea8;font-size:12px;}
      .r{fill:#ff3b3b;font-size:12px;font-weight:700;}
      .a{fill:#ffb020;font-size:11px;letter-spacing:.12em;}
      .f{stroke:#ff3b3b;stroke-width:2;fill:none;}
    </style>
  </defs>
  <rect width="860" height="440" fill="url(#jbg)"/>
  <text x="30" y="40" class="a">// AI JAILBREAK — FROM A PROBE TO A BYPASS</text>

  <rect x="30" y="66" width="185" height="118" rx="10" class="b"/>
  <text x="44" y="94" class="h">1 · recon</text>
  <text x="44" y="118" class="d">probe refusals</text>
  <text x="44" y="138" class="d">fingerprint model</text>
  <text x="44" y="158" class="d">map tools / context</text>

  <rect x="247" y="66" width="185" height="118" rx="10" class="b lit"/>
  <text x="261" y="94" class="h">2 · craft</text>
  <text x="261" y="118" class="d">persona / role-play</text>
  <text x="261" y="138" class="d">obfuscation · many-shot</text>
  <text x="261" y="158" class="d">adversarial suffix</text>

  <rect x="464" y="66" width="185" height="118" rx="10" class="b lit"/>
  <text x="478" y="94" class="h">3 · deliver</text>
  <text x="478" y="118" class="d">direct chat turn</text>
  <text x="478" y="138" class="d">indirect: RAG doc,</text>
  <text x="478" y="158" class="d">tool output, web page</text>

  <rect x="645" y="66" width="185" height="118" rx="10" class="b lit"/>
  <text x="659" y="94" class="h">4 · bypass</text>
  <text x="659" y="118" class="d">refusal suppressed</text>
  <text x="659" y="138" class="d">policy-violating</text>
  <text x="659" y="158" class="r">output emitted</text>

  <line x1="215" y1="125" x2="244" y2="125" class="f" marker-end="url(#jarr)"/>
  <line x1="432" y1="125" x2="461" y2="125" class="f" marker-end="url(#jarr)"/>
  <line x1="649" y1="125" x2="642" y2="125" class="f" marker-end="url(#jarr)"/>

  <!-- guardrail layer -->
  <rect x="30" y="250" width="800" height="90" rx="10" class="b"/>
  <text x="44" y="278" class="h">guardrail layer — breaks the chain</text>
  <text x="44" y="304" class="d">input screening · instruction hierarchy · aligned refusals · output filtering · monitoring</text>
  <text x="44" y="326" class="t">neutralise <tspan class="r">any one stage</tspan> and the bypass fails — defence in depth, not a single wall</text>

  <path d="M122 184 L122 248" class="f" marker-end="url(#jarr)"/>
  <path d="M737 184 L737 248" class="f" marker-end="url(#jarr)"/>
  <text x="128" y="214" class="d">attempts</text>
  <text x="700" y="214" class="d">blocked?</text>

  <text x="30" y="378" class="a">// MITRE ATLAS · OWASP LLM TOP 10 — LLM01 PROMPT INJECTION, LLM02 INSECURE OUTPUT</text>
</svg>
